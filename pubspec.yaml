name: rofin
description: "Rofin — a private, bilingual income and expense tracker for personal and business finances."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter 3.50 ships Material and Cupertino as standalone packages.
  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0

  # State and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local, encrypted storage
  hive_ce: ^2.24.0
  hive_ce_flutter: ^2.6.0
  flutter_secure_storage: ^11.2.0

  # Device lock
  local_auth: ^3.0.2

  # Formatting and data handling
  intl: ^0.20.3
  collection: ^1.19.1
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6

  # Reports and backup
  fl_chart: ^1.3.1
  cryptography: ^2.9.0
  share_plus: ^13.3.1
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  vm_service: ^15.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icon/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
